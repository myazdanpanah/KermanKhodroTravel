<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/nexivo-favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1524" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="کرمان خودرو" />
    <link rel="apple-touch-icon" href="/brand/nexivo-favicon.png" />
    <title>کرمان خودرو | سیستم مالی و اعلامیه</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Apply dark class synchronously before React renders to prevent flash */
      (function() {
        try {
          var stored = JSON.parse(localStorage.getItem('nexivo-theme') || '{}');
          if (stored.state && stored.state.dark) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
