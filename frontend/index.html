<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/nexivo-favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b1524" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="کرمان خودرو" />
    <link rel="apple-touch-icon" href="/brand/nexivo-favicon.png" />
    <title>کرمان خودرو | سیستم مالی و اعلامیه</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Apply theme and brand icons synchronously before React renders to prevent flash */
      (function() {
        try {
          var storedTheme = JSON.parse(localStorage.getItem('nexivo-theme') || '{}');
          if (storedTheme.state && storedTheme.state.dark) {
            document.documentElement.classList.add('dark');
          }
          var storedBrand = JSON.parse(localStorage.getItem('nexivo-brand') || '{}');
          if (storedBrand.logoUrl) {
            var icon = document.querySelector('link[rel="icon"]');
            if (icon) icon.href = storedBrand.logoUrl;
            var appleIcon = document.querySelector('link[rel="apple-touch-icon"]');
            if (appleIcon) appleIcon.href = storedBrand.logoUrl;
          }
          if (storedBrand.name) {
            var appTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appTitle) appTitle.content = storedBrand.name;
            var appName = document.querySelector('meta[name="application-name"]');
            if (appName) appName.content = storedBrand.name;
            document.title = storedBrand.name;
          }
        } catch(e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
