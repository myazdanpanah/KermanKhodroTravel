services:
  postgres:
    image: postgres:15
    container_name: nexivo_postgres
    environment:
      POSTGRES_DB: nexivo
      POSTGRES_USER: nexivo_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nexivo_redis
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: nexivo_backend
    environment:
      - DEBUG=0
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - POSTGRES_DB=nexivo
      - POSTGRES_USER=nexivo_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - SUPERSET_API_URL=http://superset:8088/api/v1
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  celery:
    build:
      context: ./backend
    container_name: nexivo_celery
    environment:
      - POSTGRES_DB=nexivo
      - POSTGRES_USER=nexivo_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    command: celery -A nexivo worker --loglevel=info
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: production
    container_name: nexivo_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
